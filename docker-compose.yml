services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: syncfin
      POSTGRES_PASSWORD: syncfin
      POSTGRES_DB: syncfin
    volumes:
      - syncfin-pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/syncfin
      DB_USER: syncfin
      DB_PASSWORD: syncfin
    ports:
      - "8080:8080"


volumes:
    syncfin-pgdata:
      external: true